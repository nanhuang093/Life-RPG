<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8a87c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life RPG">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>猫猫的 Life RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --surface: #1a1828;
    --surface2: #221f35;
    --border: #2e2a45;
    --accent: #e8a87c;
    --accent2: #7eb8c9;
    --accent3: #b5a4d4;
    --gold: #f0c060;
    --green: #7ec89a;
    --red: #e07070;
    --text: #e8e3f0;
    --text-dim: #8880a8;
    --xp-bar: #7eb8c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(126,184,201,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(181,164,212,0.06) 0%, transparent 50%);
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .header-left h1 {
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .header-left p {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }

  .stat-card .label {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .level-display {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .level-num {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .level-label {
    font-size: 13px;
    color: var(--text-dim);
  }

  .xp-bar-wrap {
    margin-top: 10px;
  }

  .xp-bar-bg {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .xp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent3));
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }

  .xp-text {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 5px;
  }

  .gold-display {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .gold-icon { font-size: 20px; }

  .gold-amount {
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
  }

  .gold-today {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 6px;
  }

  /* Tasks */
  .section {
    margin-bottom: 20px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .section-icon { font-size: 16px; }

  .section-title {
    font-size: 13px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .section-count {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    margin-left: auto;
  }

  .task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .task-item:hover {
    border-color: var(--accent2);
    background: var(--surface2);
    transform: translateX(2px);
  }

  .task-item.completed {
    opacity: 0.45;
    background: var(--surface);
  }

  .task-item.completed .task-name {
    text-decoration: line-through;
    color: var(--text-dim);
  }

  .task-checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 11px;
  }

  .task-item.completed .task-checkbox {
    background: var(--green);
    border-color: var(--green);
    color: var(--bg);
  }

  .task-info { flex: 1; min-width: 0; }

  .task-name {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .task-tags {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }

  .tag-daily { background: rgba(126,184,201,0.15); color: var(--accent2); }
  .tag-big { background: rgba(232,168,124,0.15); color: var(--accent); }
  .tag-small { background: rgba(181,164,212,0.15); color: var(--accent3); }
  .tag-bonus { background: rgba(240,192,96,0.15); color: var(--gold); }
  .tag-weekly { background: rgba(126,200,154,0.15); color: var(--green); }

  .task-reward {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    flex-shrink: 0;
  }

  .reward-xp {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent2);
    font-weight: 600;
  }

  .reward-gold {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
  }

  /* Complete button */
  .complete-btn {
    background: linear-gradient(135deg, var(--accent2), var(--accent3));
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
    font-weight: 600;
  }

  .complete-btn:hover {
    opacity: 0.85;
    transform: scale(1.05);
  }

  .task-item.completed .complete-btn { display: none; }

  /* Toast */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface2);
    border: 1px solid var(--accent2);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    color: var(--text);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Surprise modal */
  .surprise-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15,14,23,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(8px);
  }

  .surprise-modal.show {
    display: flex;
    animation: fadeIn 0.3s ease;
  }

  .surprise-content {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 20px;
    padding: 32px;
    text-align: center;
    max-width: 400px;
    animation: bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }

  .surprise-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: float 2s ease-in-out infinite;
  }

  .surprise-title {
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .surprise-message {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-line;
  }

  /* Encouragement */
  .encouragement {
    background: rgba(232,168,124,0.08);
    border: 1px solid rgba(232,168,124,0.2);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 14px;
    color: var(--accent);
    line-height: 1.6;
  }

  /* Achievement modal */
  .achievement-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15,14,23,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1001;
    backdrop-filter: blur(8px);
  }

  .achievement-modal.show {
    display: flex;
    animation: fadeIn 0.3s ease;
  }

  .achievement-content {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    border: 2px solid var(--gold);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    max-width: 450px;
    animation: bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 0 40px rgba(240,192,96,0.3);
  }

  .achievement-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: bounce 0.8s ease-in-out;
  }

  .achievement-unlock {
    font-size: 16px;
    color: var(--gold);
    margin-bottom: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }

  .achievement-name {
    font-size: 24px;
    color: var(--text);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .achievement-desc {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .achievement-xp {
    font-size: 16px;
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
  }

  /* Achievements page */
  .achievement-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }

  .achievement-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    transition: all 0.2s;
  }

  .achievement-card.unlocked {
    border-color: var(--gold);
    background: var(--surface2);
  }

  .achievement-card.locked {
    opacity: 0.4;
  }

  .achievement-card:hover.unlocked {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(240,192,96,0.2);
  }

  .achievement-card-icon {
    font-size: 48px;
    margin-bottom: 10px;
  }

  .achievement-card.locked .achievement-card-icon {
    filter: grayscale(100%);
  }

  .achievement-card-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .achievement-card-desc {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .achievement-card-xp {
    font-size: 11px;
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
  }

  .achievement-stats {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 16px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .achievement-stats strong {
    color: var(--gold);
    font-size: 16px;
  }

  /* Streak */
  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(232,168,124,0.12);
    border: 1px solid rgba(232,168,124,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 8px;
  }

  /* Progress summary */
  .progress-summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .progress-summary strong {
    color: var(--text);
    font-size: 13px;
  }

  /* Reset button */
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.2s;
  }

  .reset-btn:hover {
    border-color: var(--red);
    color: var(--red);
  }

  .tab-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .tab-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn:hover {
    border-color: var(--accent2);
    color: var(--text);
  }

  .tab-btn.active {
    background: var(--surface2);
    border-color: var(--accent2);
    color: var(--accent2);
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.05); }
    70% { transform: scale(0.9); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .pop { animation: pop 0.3s ease; }

  /* Gacha Styles */
  .gacha-container {
    padding: 20px 0;
  }

  .gacha-machines {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }

  .gacha-machine {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    transition: all 0.3s;
  }

  .gacha-machine:hover {
    transform: translateY(-4px);
    border-color: var(--accent2);
    box-shadow: 0 8px 20px rgba(126,184,201,0.2);
  }

  .gacha-machine-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: float 3s ease-in-out infinite;
  }

  .gacha-machine-name {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .gacha-machine-price {
    font-size: 16px;
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 16px;
  }

  .gacha-machine-rates {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .gacha-btn {
    background: linear-gradient(135deg, var(--accent2), var(--accent3));
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Noto Serif SC', serif;
  }

  .gacha-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(126,184,201,0.4);
  }

  .gacha-btn-premium {
    background: linear-gradient(135deg, var(--gold), var(--accent));
  }

  .gacha-hint {
    background: rgba(232,168,124,0.08);
    border: 1px solid rgba(232,168,124,0.2);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--accent);
  }

  /* Gacha Result Modal */
  .gacha-result-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15,14,23,0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1002;
    backdrop-filter: blur(8px);
  }

  .gacha-result-modal.show {
    display: flex;
    animation: fadeIn 0.3s ease;
  }

  .gacha-result-content {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    border: 2px solid var(--accent2);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    animation: bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 0 40px rgba(126,184,201,0.3);
  }

  .gacha-result-emoji {
    font-size: 96px;
    margin-bottom: 24px;
    animation: bounce 0.8s ease-in-out;
  }

  .gacha-result-name {
    font-size: 28px;
    color: var(--text);
    font-weight: 600;
    margin-bottom: 12px;
  }

  .gacha-result-rarity {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .gacha-result-collection {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .gacha-result-message {
    font-size: 16px;
    color: var(--text);
    line-height: 1.8;
    margin: 20px 0;
    padding: 20px;
    background: rgba(232,168,124,0.08);
    border-radius: 12px;
    border: 1px solid rgba(232,168,124,0.2);
    display: none;
  }

  .gacha-result-status {
    font-size: 16px;
    margin-bottom: 24px;
    font-weight: 600;
  }

  .gacha-result-close {
    background: var(--accent2);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 10px 32px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Serif SC', serif;
  }

  .gacha-result-close:hover {
    background: var(--accent3);
    transform: scale(1.05);
  }

  /* Card Zoom Modal */
  .card-zoom-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15,14,23,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1003;
    backdrop-filter: blur(10px);
    padding: 24px;
  }

  .card-zoom-modal.show {
    display: flex;
    animation: fadeIn 0.25s ease;
  }

  .card-zoom-content {
    max-width: 320px;
    width: 100%;
    animation: bounceIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  .card-zoom-close {
    display: block;
    margin: 20px auto 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 8px 32px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Noto Serif SC', serif;
    transition: all 0.2s;
  }

  .card-zoom-close:hover {
    border-color: var(--accent2);
    color: var(--text);
  }
    padding: 20px 0;
  }

  .collection-section {
    margin-bottom: 32px;
  }

  .collection-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .collection-title {
    font-size: 16px;
    color: var(--text);
    font-weight: 600;
  }

  .collection-count {
    font-size: 13px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .collection-grid {
    display: grid;

// XP thresholds per level
function xpForLevel(lv) { return 400 + lv * 30; }

// State
let state = JSON.parse(localStorage.getItem('lifeRPG') || 'null') || {
  xp: 0, gold: 0, goldToday: 0,
  completedDaily: {},    // 每天重置
  completedWeekly: {},   // 每周重置
  completedBig: {},      // 永不重置
  streak: 1, lastDate: '', lastWeekStr: '', activeTab: 0,
  unlockedAchievements: [],
  stats: {
    tasksCompleted: 0,
    dailyCompleted: 0,
    weeklyCompleted: 0,
    bigCompleted: 0,
    socialCompleted: 0,
    gachaCount: 0,
    totalGoldEarned: 0,
  },
  collection: {
    spring: [],
    summer: [],
    fossil: [],
    library: [],
    gentleMessages: { huangdou: [], gege: [] }
  },
  randomTasks: []
};

function today() {
  return new Date().toLocaleDateString('zh-CN');
}

function getWeekStr() {
  const d = new Date();
  const year = d.getFullYear();
  const startOfYear = new Date(year, 0, 1);
  const weekNum = Math.ceil(((d - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
  return `${year}-W${weekNum}`;
}

function isTaskDone(task) {
  if (task.type === 'daily') return !!state.completedDaily[task.id];
  if (task.type === 'weekly' || task.type === 'big') return !!state.completedWeekly[task.id];
  return false;
}

function markTaskDone(task) {
  if (task.type === 'daily') state.completedDaily[task.id] = true;
  else if (task.type === 'weekly' || task.type === 'big') state.completedWeekly[task.id] = true;
}

function getLevel() {
  let lv = 1, xp = state.xp;
  while (xp >= xpForLevel(lv)) { xp -= xpForLevel(lv); lv++; }
  return { level: lv, current: xp, needed: xpForLevel(lv) };
}

function save() {
  localStorage.setItem('lifeRPG', JSON.stringify(state));
}

function exportSave() {
  const data = localStorage.getItem('lifeRPG') || '{}';
  const encoded = btoa(unescape(encodeURIComponent(data)));
  const out = document.createElement('textarea');
  out.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:85vw;height:160px;z-index:9999;background:#1a1828;color:#e8e3f0;border:1px solid #7eb8c9;border-radius:12px;padding:12px;font-size:11px;font-family:monospace';
  out.value = encoded;
  out.readOnly = true;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9998';
  const tip = document.createElement('div');
  tip.style.cssText = 'position:fixed;top:calc(50% + 95px);left:50%;transform:translateX(-50%);z-index:9999;color:#7eb8c9;font-size:13px;white-space:nowrap';
  tip.textContent = '全选复制，点击背景关闭';
  overlay.onclick = () => { overlay.remove(); out.remove(); tip.remove(); };
  document.body.appendChild(overlay);
  document.body.appendChild(out);
  document.body.appendChild(tip);
  out.focus();
  out.select();
}

function importSave() {
  const text = document.getElementById('importText').value.trim();
  if (!text) return showToast('请先粘贴存档代码');
  try {
    const decoded = decodeURIComponent(escape(atob(text)));
    const parsed = JSON.parse(decoded);
    if (!parsed.xp === undefined) throw new Error('格式错误');
    localStorage.setItem('lifeRPG', decoded);
    showToast('存档导入成功，刷新中…');
    setTimeout(() => location.reload(), 1200);
  } catch(e) {
    showToast('存档代码无效，请重新复制');
  }
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(group => {
    const value = group.getValue();
    group.tiers.forEach(tier => {
      if (!state.unlockedAchievements.includes(tier.id) && value >= tier.target) {
        unlockAchievement(group, tier);
      }
    });
  });
}

function unlockAchievement(group, tier) {
  state.unlockedAchievements.push(tier.id);
  state.gold += tier.gold;
  state.goldToday += tier.gold;
  state.stats.totalGoldEarned = (state.stats.totalGoldEarned || 0) + tier.gold;

  const tierEmoji = { bronze: '🥉', silver: '🥈', gold: '🥇' }[tier.tier] || '🏆';

  document.getElementById('achievementIcon').textContent = group.icon;
  document.getElementById('achievementName').textContent = `${tierEmoji} ${tier.label}`;
  document.getElementById('achievementDesc').textContent = tier.desc;
  document.getElementById('achievementXp').textContent = `+${tier.gold} 金币 🪙`;

  const modal = document.getElementById('achievementModal');
  modal.classList.add('show');
  setTimeout(() => modal.classList.remove('show'), 4000);

  save();
}

// Gacha Functions
function drawGacha(isAdvanced = false) {
  const cost = isAdvanced ? 150 : 50;
  
  if (state.gold < cost) {
    showToast('💰 金币不够了');
    return null;
  }
  
  state.gold -= cost;
  state.stats.gachaCount = (state.stats.gachaCount || 0) + 1;
  
  // Check for gentle message drop (1% for basic, 3% for advanced)
  const gentleChance = isAdvanced ? 0.03 : 0.01;
  if (Math.random() < gentleChance) {
    const result = drawGentleMessage();
    if (result) {
      save();
      showGachaResult(result);
      return;
    }
  }
  
  // Regular gacha
  const rarity = rollRarity(isAdvanced);
  const collection = pickRandomCollection();
  const item = pickItemFromCollection(collection, rarity);
  
  // Add to collection if new
  const isNew = !state.collection[collection].includes(item.id);
  if (isNew) {
    state.collection[collection].push(item.id);
  }
  
  save();
  
  const result = {
    ...item,
    collection: GACHA_COLLECTIONS[collection].name,
    collectionKey: collection,
    isNew,
    isGentle: false
  };
  
  showGachaResult(result);
}

function drawGentleMessage() {
  // Check which messages haven't been collected
  const availableHuangdou = GENTLE_MESSAGES_HUANGDOU.filter((_, i) => 
    !state.collection.gentleMessages.huangdou.includes(i)
  );
  const availableGege = GENTLE_MESSAGES_GEGE.filter((_, i) => 
    !state.collection.gentleMessages.gege.includes(i)
  );
  
  const totalAvailable = availableHuangdou.length + availableGege.length;
  if (totalAvailable === 0) return null; // All collected
  
  // Pick random source
  const useHuangdou = Math.random() < (availableHuangdou.length / totalAvailable);
  
  if (useHuangdou && availableHuangdou.length > 0) {
    const idx = GENTLE_MESSAGES_HUANGDOU.findIndex((msg, i) => 
      !state.collection.gentleMessages.huangdou.includes(i)
    );
    state.collection.gentleMessages.huangdou.push(idx);
    return {
      id: `huangdou_${idx}`,
      name: '来自黄豆的留言',
      rarity: 'legendary',
      emoji: '🫘',
      message: GENTLE_MESSAGES_HUANGDOU[idx],
      isNew: true,
      isGentle: true,
      source: 'huangdou'
    };
  } else if (availableGege.length > 0) {
    const idx = GENTLE_MESSAGES_GEGE.findIndex((msg, i) => 
      !state.collection.gentleMessages.gege.includes(i)
    );
    state.collection.gentleMessages.gege.push(idx);
    return {
      id: `gege_${idx}`,
      name: '来自哥哥的留言',
      rarity: 'legendary',
      emoji: '🐱',
      message: GENTLE_MESSAGES_GEGE[idx],
      isNew: true,
      isGentle: true,
      source: 'gege'
    };
  }
  
  return null;
}

function rollRarity(isAdvanced) {
  const roll = Math.random();
  if (isAdvanced) {
    if (roll < 0.05) return 'epic';
    if (roll < 0.30) return 'rare';
    return 'common';
  } else {
    if (roll < 0.01) return 'epic';
    if (roll < 0.10) return 'rare';
    return 'common';
  }
}

function getCurrentSeason() {
  const month = new Date().getMonth() + 1; // 1-12
  for (const [key, col] of Object.entries(GACHA_COLLECTIONS)) {
    if (col.months && col.months.includes(month)) return key;
  }
  return 'spring'; // fallback
}

function pickRandomCollection() {
  const season = getCurrentSeason();
  const nonSeason = ['fossil', 'library', 'cambrian'];
  const pools = [season, season, ...nonSeason]; // 季节系列权重更高
  return pools[Math.floor(Math.random() * pools.length)];
}

function pickItemFromCollection(collection, rarity) {
  const items = GACHA_COLLECTIONS[collection].items.filter(i => i.rarity === rarity);
  if (items.length === 0) {
    const commons = GACHA_COLLECTIONS[collection].items.filter(i => i.rarity === 'common');
    return commons[Math.floor(Math.random() * commons.length)];
  }
  return items[Math.floor(Math.random() * items.length)];
}

function showGachaResult(result) {
  const modal = document.getElementById('gachaResultModal');
  const rarityColors = {
    common: '#8880a8', rare: '#7eb8c9', epic: '#f0c060', legendary: '#f0c060'
  };

  if (result.isGentle) {
    document.getElementById('gachaCardDisplay').innerHTML = `
      <div style="font-size:80px;margin-bottom:16px">${result.emoji}</div>
    `;
    document.getElementById('gachaResultName').textContent = result.name;
    document.getElementById('gachaResultRarity').textContent = '传说';
    document.getElementById('gachaResultRarity').style.color = '#f0c060';
    document.getElementById('gachaResultMessage').textContent = result.message;
    document.getElementById('gachaResultMessage').style.display = 'block';
    document.getElementById('gachaResultCollection').style.display = 'none';
  } else {
    const collectionName = GACHA_COLLECTIONS[result.collectionKey]?.name || result.collection;
    document.getElementById('gachaCardDisplay').innerHTML = generateCardSVG(result, collectionName);
    document.getElementById('gachaResultName').textContent = '';
    document.getElementById('gachaResultRarity').textContent = '';
    document.getElementById('gachaResultCollection').textContent = result.collection;
    document.getElementById('gachaResultCollection').style.display = 'block';
    document.getElementById('gachaResultMessage').style.display = 'none';
  }

  document.getElementById('gachaResultStatus').textContent = result.isNew ? '✨ 新获得!' : '重复';
  document.getElementById('gachaResultStatus').style.color = result.isNew ? '#7ec89a' : '#8880a8';

  modal.classList.add('show');
  render();
}

        </div>
        <div class="gacha-hint" style="margin-top:8px;opacity:0.7">
          🗓️ 当前季节: ${seasonName} · 季节系列掉落率更高
        </div>
      </div>
    `;
    container.appendChild(gachaDiv);
    return;
  }
  
  // Check if collection tab
  if (state.activeTab === 4) {
    const collectionDiv = document.createElement('div');
    
    const gentleCollected = state.collection.gentleMessages.huangdou.length + state.collection.gentleMessages.gege.length;
    const gentleTotal = GENTLE_MESSAGES_HUANGDOU.length + GENTLE_MESSAGES_GEGE.length;
    
    let collectionHTML = '<div class="collection-container">';
    
    Object.entries(GACHA_COLLECTIONS).forEach(([key, col]) => {
      const collected = state.collection[key] || [];
      collectionHTML += `
        <div class="collection-section">
          <div class="collection-header">
            <span class="collection-title">${col.name}</span>
            <span class="collection-count">${collected.length}/${col.items.length}</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;margin-bottom:8px">
            ${col.items.map(item => {
              const owned = collected.includes(item.id);
              if (owned) {
                return `<div style="opacity:1;cursor:pointer;transition:transform 0.2s" 
                  onclick="showCardZoom(${JSON.stringify(JSON.stringify(item))}, ${JSON.stringify(JSON.stringify(col.name))})"
                  onmouseover="this.style.transform='scale(1.03)'" 
                  onmouseout="this.style.transform='scale(1)'"
                >${generateCardSVG(item, col.name)}</div>`;
              } else {
                return `<div>${generateLockedCardSVG()}</div>`;
              }
            }).join('')}
          </div>
        </div>
      `;
    });

    collectionHTML += `
      <div class="collection-section">
        <div class="collection-header">
          <span class="collection-title">💝 温柔留言</span>
          <span class="collection-count">${gentleCollected}/${gentleTotal}</span>
        </div>
        <div class="gentle-messages-grid">
          <div class="gentle-source">
            <div class="gentle-source-title">🫘 来自黄豆</div>
            <div class="gentle-source-count">${state.collection.gentleMessages.huangdou.length}/${GENTLE_MESSAGES_HUANGDOU.length}</div>
            <div class="gentle-list">
              ${GENTLE_MESSAGES_HUANGDOU.map((msg, i) => {
                const owned = state.collection.gentleMessages.huangdou.includes(i);
                return `<div class="gentle-message ${owned ? 'owned' : 'locked'}">${owned ? msg : '还未解锁...'}</div>`;
              }).join('')}
            </div>
          </div>
          <div class="gentle-source">
            <div class="gentle-source-title">🐱 来自哥哥</div>
            <div class="gentle-source-count">${state.collection.gentleMessages.gege.length}/${GENTLE_MESSAGES_GEGE.length}</div>
            <div class="gentle-list">
              ${GENTLE_MESSAGES_GEGE.map((msg, i) => {
                const owned = state.collection.gentleMessages.gege.includes(i);
                return `<div class="gentle-message ${owned ? 'owned' : 'locked'}">${owned ? msg : '还未解锁...'}</div>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>`;
    
    collectionDiv.innerHTML = collectionHTML;
    container.appendChild(collectionDiv);
    return;
  }
  
  // Check if achievements tab
  if (state.activeTab === 5) {
    const achievementsDiv = document.createElement('div');
    const totalTiers = ACHIEVEMENTS.reduce((sum, g) => sum + g.tiers.length, 0);
    const unlockedCount = state.unlockedAchievements.length;

    achievementsDiv.innerHTML = `
      <div class="achievement-stats">
        已解锁 <strong>${unlockedCount}</strong> / ${totalTiers} 个成就
      </div>
      <div style="display:flex;flex-direction:column;gap:20px">
        ${ACHIEVEMENTS.map(group => {
          let value = 0;
          try { value = group.getValue(); } catch(e) {}
          const maxTarget = group.tiers[group.tiers.length - 1].target;
          const progress = Math.min(100, Math.floor((value / maxTarget) * 100));
          const tierEmojis = { bronze: '🥉', silver: '🥈', gold: '🥇' };

          return `
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
                <div style="display:flex;align-items:center;gap:10px">
                  <span style="font-size:24px">${group.icon}</span>
                  <span style="font-size:15px;color:var(--text);font-weight:600">${group.name}</span>
                </div>
                <span style="font-size:12px;color:var(--text-dim);font-family:monospace">${value} / ${maxTarget}</span>
              </div>
              <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:14px">
                <div style="height:100%;width:${progress}%;background:linear-gradient(90deg,var(--accent2),var(--accent3));border-radius:3px;transition:width 0.5s"></div>
              </div>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
                ${group.tiers.map(tier => {
                  const unlocked = state.unlockedAchievements.includes(tier.id);
                  return `
                    <div style="
                      padding:10px 8px;text-align:center;border-radius:10px;
                      background:${unlocked ? 'rgba(126,184,201,0.15)' : 'var(--surface2)'};
                      border:1px solid ${unlocked ? 'var(--accent2)' : 'var(--border)'};
                      opacity:${unlocked ? '1' : '0.5'}
                    ">
                      <div style="font-size:20px;margin-bottom:4px">${tierEmojis[tier.tier]}</div>
                      <div style="font-size:11px;color:${unlocked ? 'var(--text)' : 'var(--text-dim)'};font-weight:${unlocked ? '600' : '400'};margin-bottom:4px">${tier.label}</div>
                      <div style="font-size:9px;color:var(--text-dim)">${tier.desc}</div>
                      <div style="font-size:10px;color:var(--gold);margin-top:4px">+${tier.gold} 🪙</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    container.appendChild(achievementsDiv);

    // 存档备份区块
    const backupDiv = document.createElement('div');
    backupDiv.style.cssText = 'padding:0 16px 32px';
    backupDiv.innerHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:8px">
        <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px">💾 存档备份</div>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px">换设备或换浏览器时用这个转移数据</div>
        <button onclick="exportSave()" style="width:100%;padding:12px;background:var(--accent2);color:#0f0e17;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px">导出存档</button>
        <button onclick="document.getElementById('importArea').style.display=document.getElementById('importArea').style.display==='none'?'block':'none'" style="width:100%;padding:12px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:10px">导入存档</button>
        <div id="importArea" style="display:none">
          <textarea id="importText" placeholder="把导出的存档代码粘贴到这里..." style="width:100%;height:100px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;font-family:monospace;resize:vertical;box-sizing:border-box"></textarea>
          <button onclick="importSave()" style="width:100%;padding:12px;background:var(--accent);color:#0f0e17;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px">确认导入</button>
        </div>
      </div>
    `;
    container.appendChild(backupDiv);
    return;
  }

  const activeGroup = TYPE_GROUPS[state.activeTab || 0];
  const groupTasks = ALL_TASKS.filter(t => activeGroup.types.includes(t.type) && shouldShowTask(t));

  const cats = [...new Set(groupTasks.map(t => t.cat))];
  cats.forEach(cat => {
    const tasks = groupTasks.filter(t => t.cat === cat);
    const doneInCat = tasks.filter(t => isTaskDone(t)).length;
    const div = document.createElement('div');
    div.className = 'section';
    div.innerHTML = `
      <div class="section-header">
        <span class="section-title">${cat}</span>
        <span class="section-count">${doneInCat}/${tasks.length}</span>
      </div>
      <div class="task-list">
        ${tasks.map(task => {
          const taskName = getTaskName(task);
          return `
          <div class="task-item ${isTaskDone(task) ? 'completed' : ''}" id="task-${task.id}" onclick="completeTask('${task.id}')">
            <div class="task-checkbox">${isTaskDone(task) ? '✓' : ''}</div>
            <div class="task-info">
              <div class="task-name">${taskName}</div>
              <div class="task-tags">
                <span class="tag tag-${task.type}">${TAG_LABELS[task.type]}</span>
              </div>
            </div>
            <div class="task-reward">
              <div class="reward-xp">+${task.xp} XP</div>
              <div class="reward-gold">+${task.gold} 🪙</div>
            </div>
            ${!isTaskDone(task) ? `<button class="complete-btn" onclick="event.stopPropagation();completeTask('${task.id}')">完成</button>` : ''}
          </div>
        `;}).join('')}
      </div>
    `;
    container.appendChild(div);
  });
}

function showCardZoom(itemJson, colNameJson) {
  const item = JSON.parse(itemJson);
  const colName = JSON.parse(colNameJson);
  document.getElementById('cardZoomDisplay').innerHTML = generateCardSVG(item, colName);
  document.getElementById('cardZoomModal').classList.add('show');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function completeTask(id) {
  const task = ALL_TASKS.find(t => t.id === id);
  if (!task || isTaskDone(task)) return;

  const { level: levelBefore } = getLevel();

  markTaskDone(task);
  state.xp += task.xp;
  state.gold += task.gold;
  state.goldToday += task.gold;
  state.stats.totalGoldEarned = (state.stats.totalGoldEarned || 0) + task.gold;
  
  // Update stats
  state.stats.tasksCompleted++;
  if (task.type === 'daily') { state.stats.dailyCompleted++; rollRandomTask(false); }
  if (task.type === 'weekly') { state.stats.weeklyCompleted++; rollRandomTask(true); }
  if (task.type === 'big') state.stats.bigCompleted++;
  if (task.cat === '💬 社交') state.stats.socialCompleted++;

  const { level: levelAfter } = getLevel();

  // Level up rewards
  if (levelAfter > levelBefore) {
    const levelsGained = levelAfter - levelBefore;
    const goldReward = levelsGained * 20;
    state.gold += goldReward;
    state.goldToday += goldReward;
    state.stats.totalGoldEarned = (state.stats.totalGoldEarned || 0) + goldReward;

    // Check newly unlocked features
    const unlockMessages = {
      3:  '🎉 Lv.3 解锁: 每周任务!',
      5:  '🎉 Lv.5 解锁: 奖励大任务 + 高级扭蛋!',
      8:  '🎉 Lv.8 解锁: 随机任务抽取!',
      10: '🎉 Lv.10 解锁: 限定系列!',
      15: '🎉 Lv.15 解锁: 十连抽!'
    };
    for (let lv = levelBefore + 1; lv <= levelAfter; lv++) {
      if (unlockMessages[lv]) {
        setTimeout(() => showToast(unlockMessages[lv]), 500);
      }
    }

    // Every 10 levels: rare gacha
    let gachaReward = false;
    for (let lv = levelBefore + 1; lv <= levelAfter; lv++) {
      if (lv % 10 === 0) gachaReward = true;
    }

    if (gachaReward) {
      const collection = pickRandomCollection();
      const rareItems = GACHA_COLLECTIONS[collection].items.filter(i => i.rarity === 'rare');
      if (rareItems.length > 0) {
        const item = rareItems[Math.floor(Math.random() * rareItems.length)];
        const isNew = !state.collection[collection].includes(item.id);
        if (isNew) state.collection[collection].push(item.id);
        save();
        setTimeout(() => {
          showGachaResult({ ...item, collection: GACHA_COLLECTIONS[collection].name, collectionKey: collection, isNew, isGentle: false });
        }, 2500);
      }
      setSurpriseMessage(`🎉 升到 Lv.${levelAfter}!\n+${goldReward} 金币\n稀有扭蛋已送达 🎰`);
    } else {
      setSurpriseMessage(`🎉 升到 Lv.${levelAfter}!\n+${goldReward} 金币 🪙`);
    }
    showSurpriseModal();
  }

  save();
  checkAchievements();
  if (levelAfter === levelBefore) showSurprise();
  render();

  const el = document.getElementById('task-' + id);
  if (el) el.classList.add('pop');

  const taskName = getTaskName(task);
  showToast(`✨ +${task.xp} XP  🪙 +${task.gold}  「${taskName}」完成!`);
}

function drawTenPull() {
  if (state.gold < 450) {
    showToast('💰 金币不够了,需要450金币');
    return;
  }
  state.gold -= 450;
  state.stats.gachaCount = (state.stats.gachaCount || 0) + 10;
  let lastResult = null;
  for (let i = 0; i < 10; i++) {
    if (Math.random() < 0.03) {
      const gentle = drawGentleMessage();
      if (gentle) { lastResult = gentle; continue; }
    }
    const rarity = rollRarity(true);
    const collection = pickRandomCollection();
    const item = pickItemFromCollection(collection, rarity);
    const isNew = !state.collection[collection].includes(item.id);
    if (isNew) state.collection[collection].push(item.id);
    lastResult = { ...item, collection: GACHA_COLLECTIONS[collection].name, collectionKey: collection, isNew, isGentle: false };
  }
  save();
  checkAchievements();
  if (lastResult) showGachaResult(lastResult);
  render();
}

function rollRandomTask(isWeekly) {
  const { level: lv } = getLevel();
  if (lv < 8) return; // Lv.8解锁
  if ((state.randomTasks || []).length >= 5) return; // 最多5个

  const dropChance = isWeekly ? 0.3 : 0.15;
  if (Math.random() > dropChance) return;

  // Rarity roll
  const roll = Math.random();
  let rarity;
  if (isWeekly) {
    rarity = roll < 0.15 ? 'epic' : roll < 0.5 ? 'rare' : 'common';
  } else {
    rarity = roll < 0.05 ? 'epic' : roll < 0.25 ? 'rare' : 'common';
  }

  const pool = RANDOM_TASK_POOL[rarity];
  const task = pool[Math.floor(Math.random() * pool.length)];

  const newTask = {
    id: `random-${Date.now()}`,
    ...task,
    rarity,
    done: false
  };

  state.randomTasks = [...(state.randomTasks || []), newTask];
  save();

  const rarityLabel = { common: '普通', rare: '稀有', epic: '史诗' }[rarity];
  setSurpriseMessage(`✨ 随机任务掉落!\n[${rarityLabel}] ${task.emoji} ${task.name}`);
  showSurpriseModal();
}

function completeRandomTask(taskId) {
  const task = (state.randomTasks || []).find(t => t.id === taskId);
  if (!task || task.done) return;

  const { level: levelBefore } = getLevel();

  state.randomTasks = state.randomTasks.map(t =>
    t.id === taskId ? { ...t, done: true } : t
  );

  state.xp += task.xp;
  state.gold += task.gold;
  state.goldToday += task.gold;
  state.stats.totalGoldEarned = (state.stats.totalGoldEarned || 0) + task.gold;
  state.stats.tasksCompleted++;

  const { level: levelAfter } = getLevel();
  save();
  checkAchievements();

  if (levelAfter > levelBefore) {
    const goldReward = (levelAfter - levelBefore) * 20;
    state.gold += goldReward;
    state.goldToday += goldReward;
    state.stats.totalGoldEarned += goldReward;
    setSurpriseMessage(`🎉 升到 Lv.${levelAfter}!\n+${goldReward} 金币 🪙`);
    showSurpriseModal();
    save();
  }

  render();
  showToast(`✨ +${task.xp} XP  🪙 +${task.gold}  「${task.name}」完成!`);
}

function dismissRandomTask(taskId) {
  state.randomTasks = (state.randomTasks || []).filter(t => t.id !== taskId);
  save();
  render();
}

function switchTab(i) {
  const { level: lv } = getLevel();
  if (lv < (TYPE_GROUPS[i]?.minLevel || 1)) {
    showToast(`🔒 Lv.${TYPE_GROUPS[i].minLevel} 解锁`);
    return;
  }
  state.activeTab = i;
  save();
  render();
}

function resetDay() {
  if (!confirm('重置今日每日任务记录?\nXP和金币会一并收回。')) return;

  // 计算今日每日任务已获得的XP和金币
  let xpToRemove = 0;
  let goldToRemove = 0;
  Object.keys(state.completedDaily).forEach(id => {
    const task = ALL_TASKS.find(t => t.id === id);
    if (task) {
      xpToRemove += task.xp;
      goldToRemove += task.gold;
    }
  });

  state.completedDaily = {};
  state.xp = Math.max(0, state.xp - xpToRemove);
  state.gold = Math.max(0, state.gold - goldToRemove);
  state.goldToday = 0;
  save();
  render();
  showToast(`↩️ 已重置,收回 ${xpToRemove} XP 和 ${goldToRemove} 金币`);
}

// Check date for daily reset
const todayStr = today();
const currentWeekStr = getWeekStr();

if (state.lastDate && state.lastDate !== todayStr) {
  // New day: reset daily tasks and goldToday
  state.completedDaily = {};
  state.goldToday = 0;
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  if (state.lastDate === yesterday.toLocaleDateString('zh-CN')) {
    state.streak = (state.streak || 0) + 1;
  } else {
    state.streak = 1;
  }
}
state.lastDate = todayStr;

// Check for weekly reset
if (state.lastWeekStr && state.lastWeekStr !== currentWeekStr) {
  state.completedWeekly = {};
  showToast('📅 新的一周开始了,每周任务已重置 ✨');
}
state.lastWeekStr = currentWeekStr;

// Migrate old state
if (!state.completedDaily && !state.completedWeekly) {
  // 兼容旧数据: 把旧的completed按任务类型分配
  const old = state.completed || {};
  state.completedDaily = {};
  state.completedWeekly = {};
  Object.keys(old).forEach(id => {
    const task = ALL_TASKS.find(t => t.id === id);
    if (!task) return;
    if (task.type === 'daily') state.completedDaily[id] = true;
    else state.completedWeekly[id] = true;
  });
  delete state.completed;
}
// 确保每个字段都存在
if (!state.completedDaily) state.completedDaily = {};
if (!state.completedWeekly) state.completedWeekly = {};
if (!state.lastWeekStr) state.lastWeekStr = getWeekStr();
if (!state.collection) {
  state.collection = { spring: [], summer: [], fossil: [], library: [], cambrian: [], gentleMessages: { huangdou: [], gege: [] } };
}
if (!state.collection.summer) state.collection.summer = [];
if (!state.collection.library) state.collection.library = [];
if (!state.collection.cambrian) state.collection.cambrian = [];
if (!state.collection.books) {} else { state.collection.library = state.collection.books; delete state.collection.books; }
if (!state.collection.gentleMessages) {
  state.collection.gentleMessages = { huangdou: [], gege: [] };
}
if (!state.stats) {
  state.stats = { tasksCompleted: 0, dailyCompleted: 0, weeklyCompleted: 0, bigCompleted: 0, socialCompleted: 0, gachaCount: 0, totalGoldEarned: 0 };
}
if (!state.stats.gachaCount) state.stats.gachaCount = 0;
if (!state.stats.totalGoldEarned) state.stats.totalGoldEarned = 0;
if (!state.randomTasks) state.randomTasks = [];
if (!state.unlockedAchievements) {
  state.unlockedAchievements = [];
}

save();
render();

// Click outside modal to close
document.getElementById('surpriseModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});
document.getElementById('achievementModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});
document.getElementById('gachaResultModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});
document.getElementById('cardZoomModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});

// Register Service Worker (PWA)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
